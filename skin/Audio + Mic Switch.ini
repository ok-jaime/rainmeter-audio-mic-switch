; Audio + Mic Switch
; By AdviceWithSalt & ok-jaime (https://github.com/ok-jaime)
; Based on AudioChanger by AdviceWithSalt.
;
; Click: switch speakers <-> headphones (mics too)
; Scroll: volume  |  Middle-click: mute
; Right-click > Choose audio devices... to set up

[Metadata]
Name=Audio + Mic Switch
Author=AdviceWithSalt & ok-jaime
Information=One click switches your output and mic together. | Set up: right-click > Choose audio devices...
Version=1.0.0

[Rainmeter]
Update=1000
ContextTitle=Choose audio devices...
ContextAction=[!CommandMeasure MeasureAudio "PickDevice"]

; Your settings: @Resources\Variables.inc
[Variables]
@Include=#@#Variables.inc
White=255,255,255,255
Black=0,0,0,255

; 1 = headphones in use (picks the icon)
[MeasureAudio]
Measure=Plugin
Plugin=AudioMicSwitch
SaveTo=#@#Variables.inc
MatchOutput=#HeadphoneOutput#
Pick1=Output,SpeakerOutput,Speakers output
Pick2=Input,SpeakerMic,Speakers mic
Pick3=Output,HeadphoneOutput,Headphones output
Pick4=Input,HeadphoneMic,Headphones mic
IfCondition=MeasureAudio = 1
IfTrueAction=[!ShowMeterGroup Headphones][!HideMeterGroup Speakers][!Redraw]
IfFalseAction=[!ShowMeterGroup Speakers][!HideMeterGroup Headphones][!Redraw]
DynamicVariables=1

[IconStyle]
ImageTint=[#[#IconColor]]
DynamicVariables=1
AntiAlias=1
SolidColor=0,0,0,1
W=30
H=30
MouseScrollUpAction=[!CommandMeasure MeasureAudio "ChangeVolume +#VolumeStep#"]
MouseScrollDownAction=[!CommandMeasure MeasureAudio "ChangeVolume -#VolumeStep#"]
MiddleMouseDownAction=[!CommandMeasure MeasureAudio "ToggleMute"]

; Using a visualizer? Refresh it after switching so it follows the new device.
; Add to both LeftMouseUpAction lines, e.g.:
;   [!Refresh "Fountain of Colors" "Fountain of Colors.ini"]

[Speakers]
Meter=Image
MeterStyle=IconStyle
ImageName=#CURRENTPATH#speaker.png
Group=Speakers
LeftMouseUpAction=[!CommandMeasure MeasureAudio "SetOutput #HeadphoneOutput#"][!CommandMeasure MeasureAudio "SetInput #HeadphoneMic#"][!UpdateMeasure MeasureAudio]
Hidden=0

[Headphones]
Meter=Image
MeterStyle=IconStyle
ImageName=#CURRENTPATH#headset.png
Group=Headphones
LeftMouseUpAction=[!CommandMeasure MeasureAudio "SetOutput #SpeakerOutput#"][!CommandMeasure MeasureAudio "SetInput #SpeakerMic#"][!UpdateMeasure MeasureAudio]
Hidden=1
